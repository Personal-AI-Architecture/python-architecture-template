name: Validate Python PAA template

on:
  push:
  pull_request:

jobs:
  paa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Checkout pinned PAA contract source
        uses: actions/checkout@v4
        with:
          repository: Personal-AI-Architecture/the-architecture
          ref: 9565154901e57f184bfdd3cef5f23dd4014e2c03
          path: paa-source
      - name: Run Python suite and source drift gate
        run: python scripts/validate.py --source-checkout paa-source
